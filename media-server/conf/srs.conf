# SRS Media Server Configuration for StreamLoft
# Auto-generated configuration

# Main listener - RTMP ingest on port 1935
listen              1935;
max_connections    1000;
daemon             on;
pid                ./objs/srs.pid;
srs_log_file      ./objs/srs.log;

# HTTP API server for callbacks and status
http_server {
    enabled         on;
    listen          8080;
    dir             ./objs/nginx/html;
}

# Virtual host configuration
vhost __defaultVhost__ {
    enabled             on;
    tcp_nodelay         on;
    min_latency        on;
    gop_cache          off;
    queue_length       10;
    mw_latency         100;
    mr_latency         100;

    # HTTP callbacks for stream publish/unpublish events
    http_api {
        enabled         on;
        listen          8080;
        cross_domain    on;
    }

    # RTMP publish configuration
    publish {
        enabled             on;
        mr                  off;
        firstpkt_timeout    20000;
        normal_timeout      7000;
    }

    # Play configuration
    play {
        enabled             on;
        mw_latency         100;
        gop_cache          off;
        queue_length       10;
    }

    # HTTP hooks for callbacks to Go API
    # Note: Runtime forwarding is controlled by Go API workers, not global SRS config
    http_static {
        enabled off;
    }

    hstrs {
        enabled off;
    }

    cluster {
        enabled off;
    }
}

# Redirect root to api
api {
    enabled     on;
    listen     8080;
    raw_api {
        enabled     on;
        allow_origin *;
        allow_methods GET,POST,PUT,DELETE,OPTIONS;
        allow_headers Content-Type;
    }
}

# Callback configuration
# on_publish: Called when stream starts publishing
# on_unpublish: Called when stream stops publishing
# Note: Use http://localhost:8080 or actual Go API address
# The Go API endpoints are POST /stream/start and POST /stream/stop