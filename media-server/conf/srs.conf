# SRS Media Server Configuration for StreamLoft

# Main listener - RTMP ingest on port 1935
listen              1935;
max_connections    1000;
daemon             on;
pid                ./objs/srs.pid;
srs_log_file      ./objs/srs.log;

# HTTP server for static content and callbacks (port 8081)
http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
}

# Virtual host configuration
vhost __defaultVhost__ {
    enabled             on;
    tcp_nodelay         on;
    min_latency         on;
    gop_cache           off;
    queue_length        10;

    # RTMP publish configuration
    publish {
        enabled             on;
        firstpkt_timeout    20000;
        normal_timeout      7000;
    }

    # Play configuration  
    play {
        enabled             on;
        mw_latency          100;
        gop_cache           off;
        queue_length        10;
    }

    # HTTP API for vhost callbacks
    http_api {
        enabled         on;
        listen          8081;
        cross_domain    on;
    }

    # HTTP callbacks for stream lifecycle events
    http_static {
        enabled         on;
        on_publish     http://172.86.73.79:8080/stream/start;
        on_unpublish   http://172.86.73.79:8080/stream/stop;
    }

    hstrs {
        enabled off;
    }

    cluster {
        enabled off;
    }
}