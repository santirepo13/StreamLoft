# SRS Media Server Configuration for StreamLoft

listen              1935;
max_connections    1000;
daemon             on;
pid                ./objs/srs.pid;
srs_log_file      ./objs/srs.log;

http_server {
    enabled         on;
    listen          8081;
    dir             ./objs/nginx/html;
}

vhost __defaultVhost__ {
    enabled             on;
    tcp_nodelay         on;
    min_latency         on;
    
    play {
        enabled             on;
        mw_latency          100;
    }
    
    publish {
        enabled             on;
        firstpkt_timeout    20000;
        normal_timeout      7000;
    }
    
    http_api {
        enabled         on;
        listen          8081;
        cross_domain    on;
    }
    
    http_static {
        enabled         on;
        on_publish     http://172.86.73.79:8080/stream/start;
        on_unpublish   http://172.86.73.79:8080/stream/stop;
    }
}