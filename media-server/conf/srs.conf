# SRS Media Server Configuration for StreamLoft
# Auto-generated configuration

listen              1935;
http_server        {
    listen        8080;
    dir           ./objs/nginx/html;
}

vhost __defaultVhost__ {
    hstrs           on;
    gop_cache       off;
    queue_length    10;
    
    # RTMP ingest configuration
    ingest rtmp {
        enable on;
        application live {
            # This will forward streams to the Go API for processing
            forward {
                enabled on;
                # Go API callback for stream events
                http_hooks {
                    on_publish http://172.86.73.79:8080/api/stream/start;
                    on_unpublish http://172.86.73.79:8080/api/stream/stop;
                }
            }
        }
    }
}
